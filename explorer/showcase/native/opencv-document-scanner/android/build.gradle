apply plugin: 'com.android.library'

def primjsVersion = rootProject.findProperty('lynx.primjs.version') ?: '4.+'
def scannerCompileSdkVersion =
        rootProject.ext.has('compileSdkVersion')
                ? rootProject.ext.compileSdkVersion
                : 33
def scannerNdkVersion =
        rootProject.ext.has('ndkVersion')
                ? rootProject.ext.ndkVersion
                : rootProject.findProperty('android.ndkVersion')
def scannerAbiListValue =
        rootProject.ext.has('abiList')
                ? rootProject.ext.abiList
                : (rootProject.findProperty('abiList') ?: 'arm64-v8a')
def scannerAbiList =
        scannerAbiListValue instanceof Collection
                ? scannerAbiListValue.collect { it.toString().trim() }
                : scannerAbiListValue.toString().split(',').collect { it.trim() }
def scannerCmakeVersion =
        rootProject.ext.has('CMAKE_VERSION')
                ? rootProject.ext.CMAKE_VERSION
                : '3.18.1'

configurations {
    primjsNativeAar
    opencvNativeAar
}

task extractPrimjsNativeLibraries(type: Sync) {
    from {
        configurations.primjsNativeAar.collect { zipTree(it) }
    }
    include 'jni/**/*.so'
    into "$buildDir/primjs-native"
}

task extractOpenCVNativeLibraries(type: Sync) {
    from {
        configurations.opencvNativeAar.collect { zipTree(it) }
    }
    include 'prefab/modules/opencv_java4/include/**'
    include 'jni/**/*.so'
    into "$buildDir/opencv-native"
}

android {
    if (android.hasProperty('namespace')) {
        namespace 'com.bytedance.lynx.opencvdocumentscanner'
    }
    compileSdkVersion scannerCompileSdkVersion
    if (scannerNdkVersion) {
        ndkVersion scannerNdkVersion
    }

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 32

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                        "-DLYNX_PRIMJS_JNI_DIR=$buildDir/primjs-native/jni",
                        "-DOPENCV_NATIVE_DIR=$buildDir/opencv-native"
                cppFlags "-std=c++17", "-fexceptions", "-frtti"
                abiFilters(*scannerAbiList)
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version scannerCmakeVersion
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.startsWith('configureCMake')
            || task.name.startsWith('generateJsonModel')
            || task.name.startsWith('externalNativeBuild')) {
        task.dependsOn extractPrimjsNativeLibraries
        task.dependsOn extractOpenCVNativeLibraries
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.9.0'
    opencvNativeAar 'org.opencv:opencv:4.9.0@aar'
    implementation "org.lynxsdk.lynx:primjs:${primjsVersion}"
    primjsNativeAar "org.lynxsdk.lynx:primjs:${primjsVersion}@aar"
}
